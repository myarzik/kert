name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/kert/**"
      - "scripts/export_android_reference.py"
      - "tests/fixtures/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/kert/**"
      - "scripts/export_android_reference.py"
      - "tests/fixtures/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Core tests, lint, APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Python reference for the port (§16.6)
        run: |
          uv sync --group models --locked
          uv run python scripts/export_android_reference.py build/android-reference
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test, lint and build
        working-directory: android
        run: ./gradlew :core:test :app:lintDebug :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: android/*/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: kert-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
