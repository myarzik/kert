name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:  # dry run: build and smoke-test without publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - id: version
        shell: bash
        run: |
          version="$(uv version --short)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi

  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: [version, tests]
    strategy:
      fail-fast: false
      matrix:
        # Linux uses ubuntu-22.04 for an older glibc (runs on more distributions).
        # macOS is opt-in via the repository variable MACOS_CI=true (see ci.yml).
        include: ${{ fromJSON(vars.MACOS_CI == 'true' && '[{"os":"ubuntu-22.04","target":"linux-x86_64"},{"os":"windows-latest","target":"windows-x86_64"},{"os":"macos-latest","target":"macos-arm64"}]' || '[{"os":"ubuntu-22.04","target":"linux-x86_64"},{"os":"windows-latest","target":"windows-x86_64"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --group models --group release --locked
      - name: Build the full bundle (one directory)
        run: uv run pyinstaller packaging/kert.spec --noconfirm --distpath dist --workpath build
      - name: Build the Reader (one file)
        run: uv run pyinstaller packaging/kert-reader.spec --noconfirm --distpath dist --workpath build
      - name: Smoke-test both binaries and package them
        run: uv run python packaging/smoke_package.py dist ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: kert-${{ matrix.target }}
          path: |
            dist/kert-*.tar.gz
            dist/kert-*.zip
            dist/kert-reader-*
            dist/THIRD_PARTY_NOTICES-*.txt
          if-no-files-found: error

  android:
    name: Android APK
    needs: [version, tests]
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      # Only a signed APK is published (§16.7): updates must install over older versions.
      - name: Skip without signing secrets
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::notice::ANDROID_KEYSTORE_BASE64 is not set; the release has no Android APK"
      - uses: actions/checkout@v5
        if: env.KEYSTORE_BASE64 != ''
      - uses: actions/setup-java@v5
        if: env.KEYSTORE_BASE64 != ''
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        if: env.KEYSTORE_BASE64 != ''
      - name: Build the signed APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kert.jks"
          (cd android && KERT_ANDROID_KEYSTORE="$RUNNER_TEMP/kert.jks" ./gradlew :app:assembleRelease --console=plain)
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/kert-android-${VERSION}.apk"
          cp android/app/build/generated/assets/releaseThirdPartyNotices/third_party_notices.txt dist/THIRD_PARTY_NOTICES-android.txt
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: kert-android
          path: |
            dist/kert-android-*.apk
            dist/THIRD_PARTY_NOTICES-android.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [version, build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history and tags for the changelog
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum kert-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: uv run --only-group release git-cliff --latest --strip all > notes.md && cat notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" assets/* \
            --title "kert ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag
